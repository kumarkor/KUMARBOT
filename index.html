<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pop Ninja - Bot Admin</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        
        body {
            background: linear-gradient(135deg, #1A1F35 0%, #0F1222 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Glassmorphism Card Style */
        .card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 30px;
            width: 100%;
            max-width: 420px;
            margin-top: 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(15px);
        }

        .header-title { font-size: 26px; font-weight: 700; text-align: center; margin-bottom: 25px; background: linear-gradient(90deg, #A78BFA, #F472B6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .input-group { margin-bottom: 18px; }
        .input-group label { display: block; font-size: 13px; color: #9CA3AF; margin-bottom: 8px; font-weight: 500; }
        .input-group input {
            width: 100%; padding: 14px 18px;
            background: rgba(0, 0, 0, 0.25);
            border: 1.5px solid rgba(255, 255, 255, 0.05);
            border-radius: 14px; color: #ffffff; font-size: 15px; outline: none; transition: 0.3s;
        }
        .input-group input:focus { border-color: #8B5CF6; background: rgba(0, 0, 0, 0.4); box-shadow: 0 0 15px rgba(139, 92, 246, 0.2); }

        .btn {
            width: 100%; padding: 15px;
            background: linear-gradient(90deg, #8B5CF6 0%, #D946EF 100%);
            border: none; border-radius: 14px; color: white;
            font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s; margin-top: 10px;
            box-shadow: 0 8px 20px rgba(139, 92, 246, 0.3);
        }
        .btn:active { transform: scale(0.96); }
        .btn-revoke { background: linear-gradient(90deg, #EF4444 0%, #B91C1C 100%); box-shadow: 0 8px 20px rgba(239, 68, 68, 0.3); margin-top: 15px; }

        .switch-text { text-align: center; font-size: 14px; color: #9CA3AF; margin-top: 20px; cursor: pointer; }
        .switch-text span { color: #A78BFA; font-weight: 600; text-decoration: underline; }

        /* Dashboard Styles */
        #dashboard-section { display: none; width: 100%; max-width: 420px; margin-top: 20px; }
        .nav-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .profile-badge {
            background: rgba(139, 92, 246, 0.2); border: 1px solid rgba(139, 92, 246, 0.4);
            padding: 8px 15px; border-radius: 20px; color: #E9D5FF; font-weight: 600; font-size: 14px;
        }

        /* Wallet Card */
        .wallet-card {
            background: linear-gradient(135deg, #6366F1 0%, #8B5CF6 100%);
            border-radius: 20px; padding: 25px; text-align: center; margin-bottom: 20px;
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.3);
        }
        .wallet-title { font-size: 14px; color: rgba(255,255,255,0.8); text-transform: uppercase; letter-spacing: 1px; }
        .wallet-amount { font-size: 36px; font-weight: 700; margin-top: 5px; }

        .warning-text { font-size: 12px; color: #FCA5A5; text-align: center; margin-top: 15px; font-weight: 500; background: rgba(239,68,68,0.1); padding: 10px; border-radius: 8px; border: 1px solid rgba(239,68,68,0.2); }
        
        .alert { color: #F87171; font-size: 13px; text-align: center; margin-top: 15px; display: none; font-weight: 500; }
        .success { color: #34D399; font-size: 13px; text-align: center; margin-top: 15px; display: none; font-weight: 500; }

        #captcha-container { display: none; }
        .captcha-box { display: flex; align-items: center; justify-content: space-between; background: rgba(0,0,0,0.2); padding: 10px 15px; border-radius: 12px; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.05); }
        .captcha-question { font-size: 18px; font-weight: 600; letter-spacing: 2px; color: #A78BFA; }
        .captcha-input { width: 60% !important; margin-bottom: 0 !important; }

    </style>
</head>
<body>

    <!-- Auth Section -->
    <div class="card" id="auth-section">
        <h1 class="header-title" id="auth-title">Login</h1>
        
        <div class="input-group">
            <label>Telegram User ID / Admin ID</label>
            <input type="text" id="tg-id" placeholder="e.g. 101 or userID">
        </div>
        <div class="input-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="••••••••">
        </div>

        <!-- Maths Captcha -->
        <div id="captcha-container">
            <label style="font-size: 13px; color: #9CA3AF; margin-bottom: 5px; display:block;">Math Verification</label>
            <div class="captcha-box">
                <span class="captcha-question" id="math-q">5 + 3 = </span>
                <input type="number" id="captcha-ans" class="input-group captcha-input" placeholder="?">
            </div>
        </div>
        
        <button class="btn" id="auth-btn">Login to Dashboard</button>
        <div class="alert" id="auth-error"></div>
        
        <div class="switch-text" id="toggle-auth">
            Don't have an account? <span id="toggle-span">Create Account</span>
        </div>
    </div>

    <!-- Dashboard Section -->
    <div id="dashboard-section">
        <div class="nav-bar">
            <h2 style="font-size: 22px;">Dashboard</h2>
            <div class="profile-badge" id="user-badge">User</div>
        </div>

        <div class="wallet-card">
            <div class="wallet-title">Total Balance</div>
            <div class="wallet-amount" id="wallet-bal">₹0</div>
        </div>

        <div class="card" style="margin-top:0;">
            <div style="font-size: 18px; font-weight: 600; color: #A78BFA; margin-bottom: 20px;">Bot Configuration</div>
            
            <div class="input-group">
                <label>Telegram Bot Token</label>
                <input type="text" id="botToken" placeholder="12345:ABCDefgh...">
            </div>
            <div class="input-group">
                <label>Secret Key (Required)</label>
                <input type="password" id="botKey" placeholder="Enter Secret Key">
            </div>

            <div class="warning-text">
                ⚠️ Warning: Hi Secret Key aani Token konasobat hi share karu naye! 
            </div>
            
            <button class="btn" id="save-bot-btn">✅ Connect Bot</button>
            <button class="btn btn-revoke" id="revoke-btn">🔄 Revoke Token & Key</button>
            
            <div class="alert" id="bot-error"></div>
            <div class="success" id="bot-success"></div>

            <div style="text-align: center; margin-top: 25px;">
                <span style="color: #9CA3AF; font-size: 13px; cursor: pointer; text-decoration: underline;" id="logout-btn">Logout</span>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDkmoIzcYsYTBYwIk2A_8hUXWW5znyeTaY",
            authDomain: "newkumarbot.firebaseapp.com",
            projectId: "newkumarbot",
            storageBucket: "newkumarbot.firebasestorage.app",
            messagingSenderId: "1006933600404",
            appId: "1:1006933600404:web:1df122474a7598a25fec81",
            measurementId: "G-PMQ8SCYQC9"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let isLogin = true;
        let captchaCorrectAns = 0;
        let currentUserId = "";

        // Elements
        const authSection = document.getElementById('auth-section');
        const dashboardSection = document.getElementById('dashboard-section');
        const authBtn = document.getElementById('auth-btn');
        const errorDiv = document.getElementById('auth-error');
        const captchaContainer = document.getElementById('captcha-container');
        
        function generateCaptcha() {
            let num1 = Math.floor(Math.random() * 10) + 1;
            let num2 = Math.floor(Math.random() * 10) + 1;
            captchaCorrectAns = num1 + num2;
            document.getElementById('math-q').innerText = `${num1} + ${num2} = `;
            document.getElementById('captcha-ans').value = '';
        }

        // Toggle UI
        document.getElementById('toggle-auth').addEventListener('click', () => {
            isLogin = !isLogin;
            errorDiv.style.display = 'none';
            document.getElementById('auth-title').innerText = isLogin ? "Login" : "Create Account";
            authBtn.innerText = isLogin ? "Login to Dashboard" : "Sign Up & Verify";
            captchaContainer.style.display = isLogin ? "none" : "block";
            document.getElementById('toggle-auth').innerHTML = isLogin 
                ? "Don't have an account? <span>Create Account</span>"
                : "Already have an account? <span>Login</span>";
            if(!isLogin) generateCaptcha();
        });

        // Authentication Process
        authBtn.addEventListener('click', async () => {
            const tgId = document.getElementById('tg-id').value.trim();
            const pass = document.getElementById('password').value;
            
            if(!tgId || !pass) { showError(errorDiv, "Enter ID and Password!"); return; }

            // Admin Logic Override
            if(tgId === '101' && pass === '90901') {
                currentUserId = "Admin";
                openDashboard("Admin 👑", "₹99,999");
                loadBotData("Admin");
                return;
            }

            authBtn.innerText = "Processing...";
            const email = tgId.toLowerCase() + "@bot.com";

            try {
                if(!isLogin) {
                    const userAns = parseInt(document.getElementById('captcha-ans').value);
                    if(userAns !== captchaCorrectAns) {
                        showError(errorDiv, "Wrong Math Answer! Try again.");
                        generateCaptcha();
                        authBtn.innerText = "Sign Up & Verify";
                        return;
                    }
                    // Create Firebase User
                    const userCredential = await createUserWithEmailAndPassword(auth, email, pass);
                    currentUserId = tgId;
                    // Save Initial Balance to Firestore
                    await setDoc(doc(db, "users", currentUserId), { balance: "₹1,250", token: "", key: "" });
                    openDashboard("@" + tgId, "₹1,250");
                } else {
                    // Login Firebase User
                    await signInWithEmailAndPassword(auth, email, pass);
                    currentUserId = tgId;
                    const docSnap = await getDoc(doc(db, "users", currentUserId));
                    let bal = "₹0";
                    if (docSnap.exists()) {
                        bal = docSnap.data().balance || "₹0";
                        document.getElementById('botToken').value = docSnap.data().token || "";
                        document.getElementById('botKey').value = docSnap.data().key || "";
                    }
                    openDashboard("@" + tgId, bal);
                }
            } catch(error) {
                showError(errorDiv, error.message.replace("Firebase: ", ""));
                authBtn.innerText = isLogin ? "Login to Dashboard" : "Sign Up & Verify";
            }
        });

        function openDashboard(username, balance) {
            authSection.style.display = 'none';
            dashboardSection.style.display = 'block';
            document.getElementById('user-badge').innerText = username;
            document.getElementById('wallet-bal').innerText = balance;
        }

        // Firestore Load Data for Admin
        async function loadBotData(userId) {
            try {
                const docSnap = await getDoc(doc(db, "botConfig", userId));
                if (docSnap.exists()) {
                    document.getElementById('botToken').value = docSnap.data().token || "";
                    document.getElementById('botKey').value = docSnap.data().key || "";
                }
            } catch (e) {}
        }

        // Connect Bot to Firestore
        document.getElementById('save-bot-btn').addEventListener('click', async () => {
            const token = document.getElementById('botToken').value.trim();
            const key = document.getElementById('botKey').value.trim();
            const bError = document.getElementById('bot-error');
            const bSuccess = document.getElementById('bot-success');
            const btn = document.getElementById('save-bot-btn');

            bError.style.display = 'none'; bSuccess.style.display = 'none';

            if(!token || !key) { showError(bError, "Token and Key both are required!"); return; }
            if(token.length < 15 || !token.includes(":")) { showError(bError, "❌ Invalid Bot Token format!"); return; }
            if(key.length < 4) { showError(bError, "❌ Secret Key must be longer!"); return; }

            btn.innerText = "Saving to Database...";

            try {
                if(currentUserId === "Admin") {
                    await setDoc(doc(db, "botConfig", "Admin"), { token: token, key: key }, { merge: true });
                } else {
                    await setDoc(doc(db, "users", currentUserId), { token: token, key: key }, { merge: true });
                }
                btn.innerText = "✅ Connect Bot";
                bSuccess.innerText = "✅ Token & Key saved securely in Firestore!";
                bSuccess.style.display = 'block';
            } catch(e) {
                showError(bError, "Error saving to Database!");
                btn.innerText = "✅ Connect Bot";
            }
        });

        // Revoke Bot
        document.getElementById('revoke-btn').addEventListener('click', async () => {
            document.getElementById('botToken').value = '';
            document.getElementById('botKey').value = '';
            document.getElementById('bot-success').style.display = 'none';
            
            try {
                if(currentUserId === "Admin") {
                    await setDoc(doc(db, "botConfig", "Admin"), { token: "", key: "" }, { merge: true });
                } else {
                    await setDoc(doc(db, "users", currentUserId), { token: "", key: "" }, { merge: true });
                }
                const bError = document.getElementById('bot-error');
                bError.style.color = '#FBBF24'; 
                bError.innerText = "🔄 Token and Key Revoked & Deleted from Firestore.";
                bError.style.display = 'block';
            } catch(e) {}
        });

        // Logout
        document.getElementById('logout-btn').addEventListener('click', () => {
            signOut(auth).then(() => {
                dashboardSection.style.display = 'none';
                authSection.style.display = 'block';
                document.getElementById('tg-id').value = '';
                document.getElementById('password').value = '';
                document.getElementById('botToken').value = '';
                document.getElementById('botKey').value = '';
                authBtn.innerText = "Login to Dashboard";
                document.getElementById('bot-error').style.display = 'none';
                document.getElementById('bot-success').style.display = 'none';
                isLogin = true;
                document.getElementById('auth-title').innerText = "Login";
                authBtn.innerText = "Login to Dashboard";
                captchaContainer.style.display = "none";
                document.getElementById('toggle-auth').innerHTML = "Don't have an account? <span>Create Account</span>";
            });
        });

        function showError(element, msg) {
            element.style.color = '#F87171';
            element.innerText = msg;
            element.style.display = 'block';
        }
    </script>
</body>
</html>
